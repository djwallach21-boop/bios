# Render blueprint for the BiOS API (always-on web service).
# Connect github.com/djwallach21-boop/bios, rootDir backend/.
services:
  - type: web
    name: bios-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    # Free tier: $0 hosting. Tradeoffs: the service spins down after ~15 min
    # idle (~30-60s cold start on the next request) and has NO persistent disk,
    # so the file-backed registry (saved designs / permalinks / API keys) is
    # ephemeral and resets on restart. Fine for a 10-user demand test.
    # UPGRADE to always-on + persistent: set `plan: starter` (~$7/mo) and
    # uncomment the `disk:` block below.
    plan: free
    healthCheckPath: /api/health
    # disk:
    #   name: bios-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      # Comma-separated browser origins allowed to call the API (the Vercel
      # prod URL + any custom domain). Without this the deployed API rejects
      # all browser requests.
      - key: BIOS_ALLOWED_ORIGINS
        sync: false
      # Public base URL of THIS API, advertised in openapi.json / llms.txt so
      # self-integrating agents hit prod, not localhost.
      - key: BIOS_PUBLIC_URL
        sync: false
