# Render blueprint for the BiOS API (always-on web service).
# Connect github.com/djwallach21-boop/bios, rootDir backend/.
services:
  - type: web
    name: bios-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    # Starter plan (~$7/mo): always-on (no ~15-min idle spin-down / cold start)
    # AND a persistent disk, so the file-backed registry (saved designs /
    # permalinks / API keys) survives restarts and deploys. Required before
    # sharing permalinks -- on the free tier a restart wiped them.
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: bios-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      # Comma-separated browser origins allowed to call the API (the Vercel
      # prod URLs). Not a secret, so managed here in the blueprint.
      - key: BIOS_ALLOWED_ORIGINS
        value: https://bios-murex.vercel.app,https://bios-dylan-wallach-s-projects.vercel.app
      # Public base URL of THIS API, advertised in openapi.json / llms.txt so
      # self-integrating agents hit prod, not localhost.
      - key: BIOS_PUBLIC_URL
        value: https://bios-api-zpgh.onrender.com
